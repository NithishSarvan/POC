<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Invoice Form Fragment -->
<div th:fragment="invoice-form(formAction, isEdit)">
    <form th:action="@{${formAction}}" method="post" th:object="${invoice}">
        <input type="hidden" th:if="${isEdit}" th:field="*{id}">

        <!-- Form content same as create.jsp -->
        <!-- ... -->

        <div class="form-footer">
            <button type="submit" class="btn btn-primary">
                <span th:text="${isEdit} ? 'Update' : 'Create'"></span> Invoice
            </button>
            <button th:if="${isEdit}" type="button" class="btn btn-danger float-right"
                    onclick="confirmDelete()">
                Delete Invoice
            </button>
        </div>
    </form>
</div>
</body>
</html>
